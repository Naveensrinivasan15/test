name: RelixQ Release Gate Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  gate:
    name: Run Release Gate Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record Gate Decision to RelixQ
        env:
          RELIXQ_API_URL: https://relixq-gateway.agreeableglacier-31f0d933.eastus.azurecontainerapps.io
          RELIXQ_API_TOKEN: ${{ secrets.RELIXQ_API_TOKEN || secrets.RELIXQ_API_KEY }}
          RELIXQ_PROJECT_ID: "01a17dd1-c0a9-75ec-ba41-7cc07d292fe3"
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Exchanging API key for session token..."
          SESSION=$(curl -fsS -X POST "$RELIXQ_API_URL/auth/api-keys/exchange" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg k "$RELIXQ_API_TOKEN" '{apiKey:$k}')" | jq -r '.accessToken')
          echo "::add-mask::$SESSION"

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "$COMMIT_SHA")

          echo "Posting blocking release gate decision to RelixQ..."
          curl -fsS -X POST "$RELIXQ_API_URL/api/v1/projects/$RELIXQ_PROJECT_ID/pentest/gates" \
            -H "Authorization: Bearer $SESSION" \
            -H "Content-Type: application/json" \
            -d '{
              "decision": {
                "schema": "relixq.gate/v1",
                "verdict": "fail",
                "mode": "block",
                "fail_on": "high",
                "fail_on_score_drop": 5,
                "recorded_at": "'"$NOW"'",
                "git": {
                  "commit": "'"$COMMIT_SHA"'",
                  "base_commit": "'"$BASE_SHA"'",
                  "branch": "'"$BRANCH_NAME"'",
                  "repository": "'"$REPO_NAME"'"
                },
                "diff": {
                  "base_sha": "'"$BASE_SHA"'",
                  "head_sha": "'"$COMMIT_SHA"'",
                  "score_delta": -15,
                  "net_new_findings_count": 2,
                  "net_new_exposures_count": 0
                },
                "conditions": [
                  {
                    "id": "new-hndl-exposure",
                    "status": "pass",
                    "gating": true,
                    "evaluated": true,
                    "reason": "0 new HNDL exposures detected"
                  },
                  {
                    "id": "finding-severity",
                    "status": "fail",
                    "gating": true,
                    "evaluated": true,
                    "reason": "2 net-new high findings: MD5 and SHA1 in crypto_vulnerabilities.py"
                  },
                  {
                    "id": "regression",
                    "status": "fail",
                    "gating": false,
                    "evaluated": true,
                    "reason": "Regressions detected in cryptographic hashing functions"
                  },
                  {
                    "id": "score-regression",
                    "status": "fail",
                    "gating": true,
                    "evaluated": true,
                    "reason": "Score regression of -15 exceeds allowed drop of 5"
                  },
                  {
                    "id": "policy-decision",
                    "status": "fail",
                    "gating": true,
                    "evaluated": true,
                    "backend_evaluated": true,
                    "reason": "Violated policy: Block Broken Hash Algorithms (MD5 & SHA1)"
                  },
                  {
                    "id": "expired-exception",
                    "status": "pass",
                    "gating": false,
                    "evaluated": true,
                    "backend_evaluated": true,
                    "reason": "No active exceptions expired"
                  },
                  {
                    "id": "ownerless-critical-remediation",
                    "status": "pass",
                    "gating": false,
                    "evaluated": true,
                    "backend_evaluated": true,
                    "reason": "No unassigned critical remediation items"
                  }
                ],
                "summary": "Gate BLOCKED: Violated policy \"Block Broken Hash Algorithms (MD5 & SHA1)\""
              }
            }'

          echo "Gate failed on policy violation. Exiting with code 1 to block CI."
          exit 1
