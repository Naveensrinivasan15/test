name: RelixQ Release Gate Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  gate-check:
    name: Run Release Gate Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RelixQ CLI
        run: |
          # 1. Try pip installation (Standard for security/QAST CLI tools)
          if pip install relixq; then
            echo "Installed relixq via pip successfully."
          elif npm install -g @relixq/cli; then
            echo "Installed @relixq/cli via npm successfully."
          else
            echo "Direct package manager install not found, checking API distribution..."
            # Check what the endpoint actually responds with
            curl -sI https://relixq-gateway.agreeableglacier-31f0d933.eastus.azurecontainerapps.io/
          fi
          
          which relixq || echo "relixq binary path not set"

      - name: Run RelixQ Release Gate
        env:
          RELIXQ_API_URL: ${{ secrets.RELIXQ_API_URL }}
          RELIXQ_API_TOKEN: ${{ secrets.RELIXQ_API_KEY }}
          RELIXQ_API_KEY: ${{ secrets.RELIXQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          relixq pentest gate \
            --project "01a17dd1-c0a9-75ec-ba41-7cc07d292fe3" \
            --mode block \
            --fail-on high \
            --fail-on-score-drop 5 \
            --audit gate-audit.json \
            --json
